services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: casino_admin
      POSTGRES_PASSWORD: casino_local_admin
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - casino-postgres:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-casino.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  casino-postgres:
